<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/c23c1e844c.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
                      <div class="logo-icon">
            <i class="fa-solid fa-coins"></i>
          </div>
          <div class="logo-text">
            <h1>مدبّر</h1>
            <p>إدارة أموالك بذكاء</p>
          </div>


        </div>
      </div>

<nav class="sidebar-nav">
    <ul class="nav-list">

        <li class="nav-item active">
            <a href="#">
                <i class="fa-solid fa-house"></i>
                <span>الصفحة الرئيسية</span>
            </a>
        </li>

        <li class="nav-item">
            <a href="#">
                <i class="fa-solid fa-right-left"></i>
                <span>المعاملات</span>
            </a>
        </li>

        <li class="nav-item">
            <a href="#">
                <i class="fa-solid fa-chart-pie"></i>
                <span>الميزانيات</span>
            </a>
        </li>

        <li class="nav-item">
            <a href="#">
                <i class="fa-solid fa-piggy-bank"></i>
                <span>المدخرات</span>
            </a>
        </li>

        <li class="nav-item">
            <a href="#">
                <i class="fa-solid fa-file-invoice-dollar"></i>
                <span>الفواتير الشهرية</span>
            </a>
        </li>

    </ul>
</nav>



<div class="quick-actions">

    <h3>إجراءات سريعة</h3>

    <div class="action-item">
        <div class="action-icon send">
            <i class="fa-solid fa-paper-plane"></i>
        </div>
        <span>إرسال أموال</span>
    </div>

    <div class="action-item">
        <div class="action-icon add">
            <i class="fa-solid fa-plus"></i>
        </div>
        <span>إضافة أموال</span>
    </div>

    <div class="action-item">
        <div class="action-icon bill">
            <i class="fa-solid fa-receipt"></i>
        </div>
        <span>دفع فاتورة</span>
    </div>

    <div class="action-item">
        <div class="action-icon invest">
            <i class="fa-solid fa-chart-line"></i>
        </div>
        <span>استثمار</span>
    </div>

</div>

    </aside>
  </body>
</html>
